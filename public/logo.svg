<svg width="400" height="400" viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Gradients -->
    <linearGradient id="mainGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f97316;stop-opacity:1" />
      <stop offset="25%" style="stop-color:#fb923c;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#0891b2;stop-opacity:1" />
      <stop offset="65%" style="stop-color:#06b6d4;stop-opacity:1" />
      <stop offset="85%" style="stop-color:#10b981;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#059669;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="lineGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#fbbf24;stop-opacity:0" />
      <stop offset="20%" style="stop-color:#fbbf24;stop-opacity:0.8" />
      <stop offset="50%" style="stop-color:#fbbf24;stop-opacity:1" />
      <stop offset="80%" style="stop-color:#fbbf24;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#fbbf24;stop-opacity:0" />
    </linearGradient>
    
    <!-- Filters for 3D effect -->
    <filter id="innerShadow">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3"/>
      <feOffset dx="0" dy="-3" result="offsetblur"/>
      <feFlood flood-color="#000000" flood-opacity="0.15"/>
      <feComposite in2="offsetblur" operator="in"/>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <!-- Animations -->
    <animateTransform id="rotateRing" 
      attributeName="transform" 
      type="rotate" 
      from="0 200 200" 
      to="360 200 200" 
      dur="20s" 
      repeatCount="indefinite"/>
      
    <animate id="breathe" 
      attributeName="r" 
      values="132;135;132" 
      dur="4s" 
      repeatCount="indefinite"/>
      
    <animate id="curveAnim" 
      attributeName="stroke-dashoffset" 
      values="380;0;0;380" 
      dur="4s" 
      repeatCount="indefinite"/>
      
    <animate id="glowPulse" 
      attributeName="opacity" 
      values="0.7;1;0.7" 
      dur="3s" 
      repeatCount="indefinite"/>
  </defs>
  
  <!-- Outer rotating ring -->
  <g>
    <circle cx="200" cy="200" r="150" fill="none" stroke="#0891b2" stroke-width="8" opacity="0.3"/>
    <circle cx="200" cy="200" r="150" fill="none" stroke-width="8" stroke-dasharray="30 910" opacity="1">
      <animate attributeName="stroke" values="#0891b2;#f97316;#fbbf24;#10b981;#0891b2" dur="20s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="rotate" from="0 200 200" to="360 200 200" dur="20s" repeatCount="indefinite"/>
    </circle>
    
    <!-- Orange accent on rotating ring -->
    <path d="M 200,50 A 150,150 0 0,1 250,62" fill="none" stroke="#f97316" stroke-width="8" stroke-linecap="round">
      <animateTransform attributeName="transform" type="rotate" from="0 200 200" to="360 200 200" dur="20s" repeatCount="indefinite"/>
    </path>
  </g>
  
  <!-- White separator ring -->
  <circle cx="200" cy="200" r="142" fill="#ffffff" opacity="1"/>
  
  <!-- Main gradient circle with shadow -->
  <circle cx="200" cy="200" r="132" fill="url(#mainGradient)" filter="url(#innerShadow)">
    <animate attributeName="r" values="132;135;132" dur="4s" repeatCount="indefinite"/>
  </circle>
  
  <!-- Accent curve inside -->
  <circle cx="200" cy="200" r="60" fill="none" stroke="rgba(255,255,255,0.4)" stroke-width="3" stroke-linecap="round" stroke-dasharray="380" stroke-dashoffset="380">
    <animate attributeName="stroke-dashoffset" values="380;0;0;380" dur="4s" repeatCount="indefinite"/>
  </circle>
  
  <!-- Inner abstract shape for growth -->
  <g transform="translate(200, 210)">
    <!-- Left arc -->
    <path d="M -30,35 Q -30,0 -5,0" fill="rgba(16,185,129,0.8)" stroke="none">
      <animateTransform attributeName="transform" type="scale" values="1 0.95;1 1.05;1 0.95" dur="3s" repeatCount="indefinite"/>
    </path>
    
    <!-- Right arc -->
    <path d="M 30,35 Q 30,0 5,0" fill="rgba(249,115,22,0.8)" stroke="none">
      <animateTransform attributeName="transform" type="scale" values="1 0.95;1 1.05;1 0.95" dur="3s" repeatCount="indefinite"/>
    </path>
    
    <!-- Top accent -->
    <ellipse cx="0" cy="-5" rx="30" ry="15" fill="rgba(251,191,36,0.9)">
      <animate attributeName="opacity" values="0.9;1;0.9" dur="3s" repeatCount="indefinite"/>
    </ellipse>
  </g>
  
  <!-- Company Name - Vishwa Shree -->
  <text x="200" y="190" font-family="Arial, sans-serif" font-size="42" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="-1">
    <tspan>Vishwa Shree</tspan>
    <animate attributeName="y" values="190;187;190" dur="3s" repeatCount="indefinite"/>
  </text>
  
  <!-- Enterprises Text -->
  <text x="200" y="230" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="5">
    <tspan>ENTERPRISES</tspan>
    <animate attributeName="opacity" values="0.95;1;0.95" dur="2.5s" repeatCount="indefinite"/>
  </text>
  
  <!-- Accent Line -->
  <line x1="120" y1="250" x2="280" y2="250" stroke="url(#lineGradient)" stroke-width="3" stroke-linecap="round">
    <animate attributeName="opacity" values="0.7;1;0.7" dur="3s" repeatCount="indefinite"/>
  </line>
  
  <!-- Decorative Dots -->
  <circle cx="185" cy="270" r="3" fill="#0891b2">
    <animate attributeName="r" values="3;4.5;3" dur="1.8s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.8;1;0.8" dur="1.8s" repeatCount="indefinite"/>
  </circle>
  
  <circle cx="200" cy="270" r="3" fill="#fbbf24">
    <animate attributeName="r" values="3;4.5;3" dur="1.8s" begin="0.3s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.8;1;0.8" dur="1.8s" begin="0.3s" repeatCount="indefinite"/>
  </circle>
  
  <circle cx="215" cy="270" r="3" fill="#10b981">
    <animate attributeName="r" values="3;4.5;3" dur="1.8s" begin="0.6s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.8;1;0.8" dur="1.8s" begin="0.6s" repeatCount="indefinite"/>
  </circle>
</svg>
